<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>smoke</title>
<style>body{background:#111;color:#ddd;font:14px/1.6 Consolas,monospace;padding:16px}</style>
</head>
<body>
<pre id="out">running…</pre>
<script type="module">
import { FilesetResolver, HandLandmarker, FaceLandmarker } from '../vendor/vision_bundle.mjs';

const out = document.getElementById('out');
const S = { wasm: '-', hand: '-', face: '-', handFrames: 0, faceFrames: 0, handMs: 0, faceMs: 0, err: [] };
const lines = [];
function w(s) { lines.push(s); out.textContent = lines.join('\n'); window.__SMOKE__ = S; }
w('start ' + new Date().toISOString());

// 合成视频源（不依赖摄像头）：一个移动的渐变画面
const cv = document.createElement('canvas');
cv.width = 640; cv.height = 480;
const cx = cv.getContext('2d');
const video = document.createElement('video');
video.muted = true; video.playsInline = true; video.autoplay = true;
video.srcObject = cv.captureStream(15);
video.play().catch((e) => S.err.push('video.play: ' + e.message));

let frame = 0;
function paint() {
  frame++;
  cx.fillStyle = '#101820'; cx.fillRect(0, 0, 640, 480);
  const g = cx.createLinearGradient(0, 0, 640, 480);
  g.addColorStop(0, '#2a4a6a'); g.addColorStop(1, '#6a2a4a');
  cx.fillStyle = g; cx.fillRect((frame * 3) % 200, 100, 300, 300);
  requestAnimationFrame(paint);
}
paint();
for (let i = 0; i < 100 && video.readyState < 2; i++) await new Promise((r) => setTimeout(r, 100));
w('video ready: ' + video.videoWidth + 'x' + video.videoHeight + ' readyState=' + video.readyState);

try {
  const t0 = performance.now();
  const vision = await FilesetResolver.forVisionTasks('../vendor/wasm');
  S.wasm = 'ok (' + Math.round(performance.now() - t0) + 'ms)';
  w('wasm ' + S.wasm);

  const t1 = performance.now();
  let hand, face;
  try {
    hand = await HandLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: '../vendor/models/hand_landmarker.task', delegate: 'GPU' },
      runningMode: 'VIDEO', numHands: 2,
    });
    S.hand = 'GPU ok (' + Math.round(performance.now() - t1) + 'ms)';
  } catch (e) {
    S.err.push('hand GPU: ' + e.message);
    hand = await HandLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: '../vendor/models/hand_landmarker.task', delegate: 'CPU' },
      runningMode: 'VIDEO', numHands: 2,
    });
    S.hand = 'CPU fallback';
  }
  w('hand ' + S.hand);

  const t2 = performance.now();
  try {
    face = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: '../vendor/models/face_landmarker.task', delegate: 'GPU' },
      runningMode: 'VIDEO', numFaces: 1,
    });
    S.face = 'GPU ok (' + Math.round(performance.now() - t2) + 'ms)';
  } catch (e) {
    S.err.push('face GPU: ' + e.message);
    face = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: '../vendor/models/face_landmarker.task', delegate: 'CPU' },
      runningMode: 'VIDEO', numFaces: 1,
    });
    S.face = 'CPU fallback';
  }
  w('face ' + S.face);

  const need = 40;
  const hsArr = [], fsArr = [];
  let n = 0;
  while (n < need) {
    await new Promise((r) => requestAnimationFrame(r));
    const now = Math.round(performance.now());
    let a = performance.now();
    try { hand.detectForVideo(video, now); } catch (e) { S.err.push('hand detect: ' + e.message); }
    let b = performance.now(); hsArr.push(b - a); S.handFrames++;
    try { face.detectForVideo(video, now); } catch (e) { S.err.push('face detect: ' + e.message); }
    const c = performance.now(); fsArr.push(c - b); S.faceFrames++;
    n++;
  }
  const med = (arr) => {
    const v = arr.slice(5).slice().sort((x, y) => x - y);
    return v.length ? v[Math.floor(v.length / 2)] : 0;
  };
  S.handMs = med(hsArr);
  S.faceMs = med(fsArr);
  S.handMsAll = hsArr.reduce((x, y) => x + y, 0) / Math.max(1, hsArr.length);
  S.faceMsAll = fsArr.reduce((x, y) => x + y, 0) / Math.max(1, fsArr.length);
  w(`frames=${n} hand median=${S.handMs.toFixed(1)}ms (avg incl. warmup ${S.handMsAll.toFixed(1)}ms)`);
  w(`          face median=${S.faceMs.toFixed(1)}ms (avg incl. warmup ${S.faceMsAll.toFixed(1)}ms)`);
  w('renderer=' + (() => { try { const gl = document.createElement('canvas').getContext('webgl2'); const d = gl.getExtension('WEBGL_debug_renderer_info'); return gl.getParameter(d.UNMASKED_RENDERER_WEBGL); } catch (e) { return 'n/a'; } })());
  w('budget@5fps single-core = ' + (((S.handMs * 5 + S.faceMs * 0.4) / 10)).toFixed(1) + '%');
  w('budget@10fps single-core = ' + (((S.handMs * 10 + S.faceMs * 0.5) / 10)).toFixed(1) + '%');} catch (e) {
  S.err.push('fatal: ' + (e && e.message || e));
}

w('');
w('errors: ' + (S.err.length ? '\n  - ' + S.err.join('\n  - ') : 'none'));
w('RESULT=' + (S.err.length ? 'WARN' : 'OK'));
document.title = 'SMOKE:' + (S.err.length ? 'WARN' : 'OK');
</script>
</body>
</html>
